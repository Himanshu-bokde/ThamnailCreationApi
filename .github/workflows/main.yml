name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ThamnailCreation

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          echo "$EC2_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} 'mkdir -p ~/myapp'

          rsync -avz --exclude=node_modules --exclude=.git \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            ./ ${EC2_USER}@${EC2_HOST}:~/myapp/

          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} '
            cd ~/myapp
            npm install --production
            pm2 stop myapp || true
            pm2 start index.js --name myapp
            pm2 save
          '

          rm -f private_key.pem
