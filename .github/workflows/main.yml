name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ThamnailCreation

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}

          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_THUMBNAIL_BUCKET_NAME: ${{ secrets.AWS_THAMNAILBUCKET_NAME }}

        run: |
          # Save private key to file
          echo "$EC2_KEY" > private_key.pem
          chmod 600 private_key.pem

          # Create folder in EC2 if not exists
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} "mkdir -p ~/myapp"

          # Upload code to EC2
          rsync -avz --exclude=node_modules --exclude=.git \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            ./ ${EC2_USER}@${EC2_HOST}:~/myapp/

          # Run deployment steps on EC2
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} "
            cd ~/myapp

            # Create environment file
            echo 'AWS_REGION=${AWS_REGION}' > .env
            echo 'AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}' >> .env
            echo 'AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}' >> .env
            echo 'AWS_BUCKET_NAME=${AWS_BUCKET_NAME}' >> .env
            echo 'AWS_THUMBNAIL_BUCKET_NAME=${AWS_THUMBNAIL_BUCKET_NAME}' >> .env

            # Install only production deps
            npm install --production

            # Restart app with PM2
            pm2 delete myapp || true
            pm2 start index.js --name myapp
            pm2 save
          "

          # Cleanup key
          rm -f private_key.pem
