name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - master   # your main or master branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout Code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Setup Node.js (optional, for tests/build)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Step 3 — Install dependencies (LOCAL, not on EC2)
      - name: Install dependencies
        run: npm ci

      # Step 4 — Deploy to EC2
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          # Create SSH key file
          echo "$EC2_KEY" > private_key.pem
          chmod 600 private_key.pem

          echo "📁 Creating app directory on EC2..."
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} "mkdir -p ~/myapp"

          echo "📤 Uploading files to EC2..."
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            ./ ${EC2_USER}@${EC2_HOST}:~/myapp/

          echo "🚀 Restarting app on EC2..."
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} "
            cd ~/myapp
            npm install --production
            sudo npm install -g pm2
            pm2 stop myapp || true
            pm2 start index.js --name myapp
            pm2 save
          "

          # Clean private key
          rm -f private_key.pem
