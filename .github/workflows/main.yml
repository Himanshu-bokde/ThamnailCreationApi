name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ThamnailCreation  

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          # Create SSH key file safely
          echo "${EC2_KEY}" | tr -d '\r' > private_key.pem
          chmod 600 private_key.pem

          # Create folder
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} "mkdir -p ~/myapp"

          # Copy project files
          scp -o StrictHostKeyChecking=no -i private_key.pem -r * ${EC2_USER}@${EC2_HOST}:~/myapp/

          # Install and restart app via PM2
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${EC2_USER}@${EC2_HOST} "
            cd ~/myapp
            npm install --production
            pm2 stop myapp || true
            pm2 start index.js --name myapp
            pm2 save
          "

          # Clean key
          rm -f private_key.pem
