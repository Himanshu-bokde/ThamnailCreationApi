name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - master  # your default branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout your code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2 — Setup Node.js (optional, if you want to build/test)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Step 3 — Install dependencies (optional, for build/test)
      - name: Install Dependencies
        run: npm ci

      # Step 4 — Deploy to EC2
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          # Create SSH key file
          echo "$EC2_KEY" > Thamnail-creation.pem
          chmod 600 Thamnail-creation.pem

          # Create deployment directory on EC2
          ssh -o StrictHostKeyChecking=no -i Thamnail-creation.pem ${EC2_USER}@${EC2_HOST} 'mkdir -p ~/myapp'

          # Copy all project files to EC2
          scp -o StrictHostKeyChecking=no -i Thamnail-creation.pem -r * ${EC2_USER}@${EC2_HOST}:~/myapp/

          # SSH into EC2 and restart Node.js app using PM2
          ssh -o StrictHostKeyChecking=no -i Thamnail-creation.pem ${EC2_USER}@${EC2_HOST} '
            cd ~/myapp
            npm install --production
            pm2 stop myapp || true
            pm2 start index.js --name myapp
            pm2 save
          '

          # Clean up the SSH key
          rm -f Thamnail-creation.pem
